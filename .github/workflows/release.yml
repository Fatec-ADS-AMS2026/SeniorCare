name: release

# Dispara ao criar uma tag de versão (ex.: v2026.08.0).
# Builda TODAS as imagens com a mesma tag, empurra para o GHCR e gera o release manifest.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # criar o GitHub Release
  packages: write   # push no GHCR

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: api,        context: ./SeniorCareManager-Backend/SeniorCareManager.WebAPI, image: seniorcare-api,       var: API_IMAGE,           base_path: / }
          - { module: care-web,   context: ./SeniorCareManager-Frontend/SeniorCareManagerFrontend, image: seniorcare-care-web,  var: CARE_WEB_IMAGE,      base_path: /care/ }
          - { module: stock-web,  context: ./SeniorStockManager-Frontend/SeniorStockManagerFrontend, image: seniorcare-stock-web, var: STOCK_WEB_IMAGE,     base_path: /stock/ }
          - { module: senior-portal, context: ./SeniorPortal-Frontend/SeniorPortalFrontend, image: seniorcare-senior-portal, var: SENIOR_PORTAL_IMAGE, base_path: / }
    steps:
      - uses: actions/checkout@v5

      - name: Set up Buildx
        # Cria um builder com driver docker-container — necessário para o cache
        # gha (cache-to/from: type=gha). O driver docker padrão não suporta export.
        uses: docker/setup-buildx-action@v3

      - name: Derivar versão da tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
            VITE_BASE_PATH=${{ matrix.base_path }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Registrar fragmento do manifest com proveniência
        run: |
          mkdir -p _manifest
          IMG="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}"
          {
            echo "RELEASE=${{ steps.ver.outputs.version }}"
            echo "GIT_SHA=${GITHUB_SHA}"
            echo "COMPONENT=${{ matrix.module }}"
            echo "${{ matrix.var }}=${IMG}:${{ steps.ver.outputs.version }}@${{ steps.build.outputs.digest }}"
          } > "_manifest/${{ matrix.var }}.env"

      - name: Upload fragmento do manifest
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.var }}
          path: _manifest/${{ matrix.var }}.env

  migration-script:
    # Gera o SQL idempotente das migrações — o servidor de produção nunca tem SDK .NET
    # (modelo build-once/deploy-many, docs/infra/ci-cd-arquitetura.md), então esse SQL
    # precisa ser gerado aqui e distribuído como artefato do release. deploy.sh roda esse
    # SQL contra o Postgres de produção real dentro de uma transação que sempre reverte
    # (pré-validação — ver design.md, risco "Migração falha por dados atuais inválidos"),
    # detectando violação de constraint ANTES do deploy real acontecer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Versão
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Gerar migration.sql idempotente
        working-directory: SeniorCareManager-Backend/SeniorCareManager.WebAPI
        run: |
          dotnet tool restore
          dotnet ef migrations script --idempotent --output migration.sql
          test -s migration.sql
          {
            echo "RELEASE=${{ steps.ver.outputs.version }}"
            echo "GIT_SHA=${GITHUB_SHA}"
          } > migration.provenance

      - name: Upload do script de migração
        uses: actions/upload-artifact@v4
        with:
          name: migration-script
          path: |
            SeniorCareManager-Backend/SeniorCareManager.WebAPI/migration.sql
            SeniorCareManager-Backend/SeniorCareManager.WebAPI/migration.provenance

  manifest:
    needs: [build, migration-script]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Versão
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Baixar fragmentos
        uses: actions/download-artifact@v4
        with:
          path: _frag
          pattern: manifest-*
          merge-multiple: true

      - name: Baixar script de migração
        uses: actions/download-artifact@v4
        with:
          name: migration-script
          path: _migration

      - name: Validar proveniência e montar assets do release
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          SHA="${GITHUB_SHA}"
          required=(API_IMAGE CARE_WEB_IMAGE STOCK_WEB_IMAGE SENIOR_PORTAL_IMAGE)

          for variable in "${required[@]}"; do
            fragment="_frag/${variable}.env"
            test -f "$fragment" || { echo "fragmento ausente: $fragment"; exit 1; }
            grep -qxF "RELEASE=$V" "$fragment"
            grep -qxF "GIT_SHA=$SHA" "$fragment"
            grep -qE "^${variable}=ghcr\.io/.+:[^@]+@sha256:[0-9a-f]{64}$" "$fragment"
          done

          test -s _migration/migration.sql
          grep -qxF "RELEASE=$V" _migration/migration.provenance
          grep -qxF "GIT_SHA=$SHA" _migration/migration.provenance

          mkdir -p releases
          OUT="releases/${V}.env"
          {
            echo "# Release manifest gerado por release.yml — NÃO editar à mão."
            echo "RELEASE=${V}"
            echo "GIT_TAG=${GITHUB_REF_NAME}"
            echo "GIT_SHA=${GITHUB_SHA}"
            echo "BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            grep -hE '^[A-Z_]+_IMAGE=' _frag/*.env | sort
          } > "$OUT"
          cp _migration/migration.sql "releases/${V}-migration.sql"
          test -s "$OUT"
          test -s "releases/${V}-migration.sql"

      - name: Verificar assets obrigatórios do GitHub Release
        run: |
          V="${{ steps.ver.outputs.version }}"
          test -s "releases/${V}.env"
          test -s "releases/${V}-migration.sql"

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/${{ steps.ver.outputs.version }}.env
            releases/${{ steps.ver.outputs.version }}-migration.sql
          generate_release_notes: true

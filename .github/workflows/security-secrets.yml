name: security-secrets

# Detecção de segredos — gate em pull requests (só os commits novos do PR, rápido) e
# varredura periódica completa (drift só é pego numa rodada full history). Regras/allowlist
# versionadas em .gitleaks.toml — mudança de escopo passa por PR normal, com justificativa
# obrigatória por entrada (ver comentários no arquivo).
on:
  pull_request:
  schedule:
    # Toda terça-feira 06:00 UTC — varredura completa do histórico, independente de PR.
    - cron: '0 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-secrets-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: '8.30.1'

jobs:
  gitleaks-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Detecção de segredos — só os commits do PR
        run: |
          gitleaks detect --source . --config .gitleaks.toml \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            -v

  gitleaks-full-scan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Detecção de segredos — histórico completo
        run: gitleaks detect --source . --config .gitleaks.toml -v

name: security-sca

# SCA do backend em duas camadas complementares:
#   - backend-sca: advisory database da NuGet/GitHub via `dotnet list package
#     --vulnerable` — rápido, sem chave externa. Roda em PR (gate) e periodicamente.
#   - nvd-dependency-check: OWASP Dependency-Check contra a base do NVD (CVE mais
#     ampla que a GHSA, cobre CVE sem advisory GitHub mapeado) — mais lento, precisa
#     do secret NVD_API_KEY. Só roda no schedule semanal/workflow_dispatch, não em PR
#     (ver comentário no job — custo de ~40min por execução enquanto o sync inicial
#     da base do NVD estiver instável neste ambiente).
on:
  pull_request:
  schedule:
    # Toda segunda-feira 06:00 UTC — drift de CVE independe de mudança de código.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-sca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'SeniorCareManager-Backend/**'
              - '.github/workflows/security-sca.yml'
              - '.github/scripts/nuget-audit-gate.py'

  backend-sca:
    needs: changes
    # Roda sempre fora de PR (schedule/workflow_dispatch); em PR, só quando o path filtrado
    # muda — evita rodar (e pedir pacotes NuGet do net) em PR que só toca frontend/docs.
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restaurar pacotes
        working-directory: SeniorCareManager-Backend/SeniorCareManager.WebAPI
        run: dotnet restore
      - name: Listar pacotes vulneráveis (diretos + transitivos)
        working-directory: SeniorCareManager-Backend/SeniorCareManager.WebAPI
        run: >-
          dotnet list package --vulnerable --include-transitive --format json
          > vulnerable-packages.json
      - name: Gate SCA — alto/crítico
        working-directory: SeniorCareManager-Backend/SeniorCareManager.WebAPI
        run: >-
          python3 ../../.github/scripts/nuget-audit-gate.py
          vulnerable-packages.json --min-severity high

  nvd-dependency-check:
    # Informativo, não bloqueia merge (não entra em security-sca-required) — o sync
    # inicial da base do NVD pela ferramenta owasp/dependency-check se mostrou instável
    # neste ambiente: falhou repetidamente com "Unable to obtain an exclusive lock on
    # the H2 database" após ~40min tentando atualizar, um problema conhecido da própria
    # ferramenta sob sync inicial longo, não do nosso workflow/config. Como o job falha
    # antes de completar, o cache da base NVD (actions/cache, save-always: false) nunca
    # chega a ser salvo — isso faria toda PR pagar ~40min de download, não só a 1ª da
    # semana. Por isso roda só no schedule semanal/workflow_dispatch, nunca em PR. O
    # gate real de vulnerabilidade do backend continua sendo o `backend-sca` nativo
    # (GHSA via `dotnet list package --vulnerable`), que roda em toda PR e já é rápido
    # e confiável. Quando este job completa com sucesso, o relatório HTML/JSON fica
    # disponível como artefato.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # A imagem owasp/dependency-check embute um runtime .NET próprio para o Assembly
      # Analyzer indexar os DLLs resolvidos — publicar deixa todo pacote NuGet (direto e
      # transitivo) como um .dll físico pra ele examinar.
      - name: Publicar backend
        working-directory: SeniorCareManager-Backend/SeniorCareManager.WebAPI
        run: dotnet publish -c Release -o publish
      - name: Semana corrente (chave de cache)
        id: week
        run: echo "week=$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restaurar cache da base NVD (reproduzível entre execuções)
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          # Chave semanal: a base NVD é atualizada continuamente — cache válido por até 7
          # dias, depois disso reconcilia incrementalmente contra o cache restante.
          key: dependency-check-nvd-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: |
            dependency-check-nvd-${{ runner.os }}-
      - name: OWASP Dependency-Check (NVD) — backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p "$HOME/.dependency-check-data" dependency-check-report
          # Sem --failOnCVSS: este job é informativo (ver comentário no job acima), não
          # gate. O relatório é o produto — achado real de CVE vira artefato pra revisão
          # manual, não trava merge automaticamente.
          docker run --rm \
            -v "$PWD/SeniorCareManager-Backend/SeniorCareManager.WebAPI/publish:/src:ro" \
            -v "$PWD/dependency-check-report:/report" \
            -v "$HOME/.dependency-check-data:/data" \
            owasp/dependency-check:latest \
            --scan /src --out /report --data /data --project "SeniorCareManager" \
            --format HTML --format JSON --nvdApiKey "$NVD_API_KEY"
      - name: Publicar relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report/*
          if-no-files-found: warn
          retention-days: 30

  security-sca-required:
    # `backend-sca` só roda em PR quando o backend muda — um required status check da
    # branch protection que nunca roda trava o PR pra sempre. Este job sempre roda em PR
    # (inclusive quando `backend-sca` foi pulado) e é o único que a branch protection
    # deve exigir deste workflow. `nvd-dependency-check` é deliberadamente informativo
    # (ver comentário no job) — não entra aqui.
    needs: [changes, backend-sca]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checar resultado do job
        run: |
          r="${{ needs.backend-sca.result }}"
          if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
            echo "FALHOU: backend-sca não teve sucesso (status: $r)."
            exit 1
          fi
          echo "OK."

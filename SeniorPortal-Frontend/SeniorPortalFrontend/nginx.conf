server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # CSP + anti-clickjacking. `add_header` do nginx não herda para location{} que já
    # define o próprio add_header — por isso estas duas linhas se repetem no location de
    # assets estáticos abaixo. Mesma política de care-web/stock-web (§8.2 centraliza os
    # cabeçalhos na borda; estes ficam como defesa em profundidade por app).
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # Proxy para a API — redireciona chamadas /api/* para o container do backend.
    location /api {
        proxy_pass         http://seniorcare-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
        proxy_read_timeout 120s;
    }

    # public-config.json (§4.1/§8.1) — gerado em runtime pelo entrypoint do
    # container (docker-entrypoint.d/10-public-config.sh), nunca cacheado
    # como os assets com hash abaixo, pra trocar sem exigir rebuild do bundle.
    location = /public-config.json {
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    }

    # SPA — todas as rotas caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache longo para assets com hash gerados pelo Vite
    location ~* \.(js|css|woff2?|png|jpg|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}

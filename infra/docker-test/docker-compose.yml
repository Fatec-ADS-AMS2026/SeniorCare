services:

  # ── Banco de dados ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: seniorcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-db_seniorcare}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - seniorcare-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-db_seniorcare}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4
    container_name: seniorcare-pgadmin
    restart: unless-stopped
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - seniorcare-net

  # ── Backend ────────────────────────────────────────────────────────────
  seniorcare-api:
    build:
      context: ../../SeniorCareManager-Backend/SeniorCareManager.WebAPI
      dockerfile: Dockerfile
    image: seniorcare/api:test
    container_name: seniorcare-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-db_seniorcare};
        Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};
      # Bootstrap da instituição/admin inicial — as três juntas ou nenhuma (Program.cs
      # valida). Ausentes aqui = deploy sobe normalmente mas nunca bootstrapa (achado §12).
      Bootstrap__InstitutionName: ${Bootstrap__InstitutionName:-}
      Bootstrap__AdminEmail: ${Bootstrap__AdminEmail:-}
      Bootstrap__AdminDisplayName: ${Bootstrap__AdminDisplayName:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - seniorcare-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Frontends ──────────────────────────────────────────────────────────
  care-web:
    build:
      context: ../../SeniorCareManager-Frontend/SeniorCareManagerFrontend
      dockerfile: Dockerfile
    image: seniorcare/care-web:test
    container_name: seniorcare-care-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      seniorcare-api:
        condition: service_healthy
    networks:
      - seniorcare-net

  stock-web:
    build:
      context: ../../SeniorStockManager-Frontend/SeniorStockManagerFrontend
      dockerfile: Dockerfile
    image: seniorcare/stock-web:test
    container_name: seniorcare-stock-web
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      seniorcare-api:
        condition: service_healthy
    networks:
      - seniorcare-net

  senior-portal:
    build:
      context: ../../SeniorPortal-Frontend/SeniorPortalFrontend
      dockerfile: Dockerfile
    image: seniorcare/senior-portal:test
    container_name: seniorcare-senior-portal
    restart: unless-stopped
    environment:
      PUBLIC_NAME: ${PUBLIC_NAME:-SeniorCare}
    ports:
      - "3002:80"
    depends_on:
      seniorcare-api:
        condition: service_healthy
    networks:
      - seniorcare-net

networks:
  seniorcare-net:
    driver: bridge

volumes:
  postgres-data:
